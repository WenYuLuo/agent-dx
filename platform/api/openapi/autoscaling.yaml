openapi: 3.1.0
info:
  title: Coordinator autoscaling HTTP
  version: 0.1.0
  description: Optional direct Coordinator HTTP listener configured by autoscaling_listen.
servers:
  - url: http://127.0.0.1:19092
security: []
paths:
  /global-scheduler/scheduling_queue:
    get:
      operationId: getCoordinatorSchedulingQueue
      summary: Read up to 10000 central waiting requests
      responses:
        '200':
          description: In-memory waiting requests; count is the returned length.
          content:
            application/json:
              schema: {$ref: './environment.yaml#/components/schemas/SchedulingQueue'}
        default: {$ref: '#/components/responses/Error'}
  /global-scheduler/node/localschedulingstatus:
    parameters:
      - name: node_id
        in: query
        required: true
        schema: {type: string, minLength: 1}
    post:
      operationId: pauseCoordinatorNodeScheduling
      summary: Persist node administrative admission pause
      description: Existing execution continues. Previously accepted operations may finish afterward.
      responses:
        '200':
          description: Administrative pause recorded.
          content:
            application/json:
              schema: {$ref: './environment.yaml#/components/schemas/NodeSchedulingStatus'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: resumeCoordinatorNodeScheduling
      summary: Remove node administrative admission pause
      description: Local pressure and reconciliation can still keep admission closed.
      responses:
        '200':
          description: Administrative pause removed.
          content:
            application/json:
              schema: {$ref: './environment.yaml#/components/schemas/NodeSchedulingStatus'}
        default: {$ref: '#/components/responses/Error'}
  /instance-manager/query-tenant-instances:
    get:
      operationId: queryCoordinatorEnvironments
      summary: Query authoritative Environment ownership with filters before pagination
      description: |
        Returns all matching tenants when tenant_id is omitted. Reserved ownership
        and nonterminal records are included. Deleted records with no resources
        held are omitted. Each request uses one storage snapshot; separate pages
        are not a retained snapshot. No authentication or authorization is performed.
      parameters:
        - {name: node_id, in: query, schema: {type: string, minLength: 1}}
        - {name: tenant_id, in: query, schema: {type: string, minLength: 1}}
        - {name: instance_id, in: query, schema: {type: string, minLength: 1}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
      responses:
        '200':
          description: Total matching count, current page and observed control revision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnvironmentPage'}
        default: {$ref: '#/components/responses/Error'}
components:
  responses:
    Error:
      description: Invalid query (400), unknown node or route (404), unavailable state (503), timeout (504), or internal failure (500).
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: {type: string}
                  message: {type: string}
  schemas:
    EnvironmentPage:
      type: object
      required: [count, instanceInfos, epoch, revision]
      properties:
        count: {type: integer, minimum: 0, description: Total matching count before pagination.}
        epoch: {type: integer, minimum: 1}
        revision: {type: integer, minimum: 1}
        instanceInfos:
          type: array
          maxItems: 1000
          items: {$ref: '#/components/schemas/EnvironmentView'}
        node:
          description: Present only for queries with node_id.
          type: object
          required: [node_id, scheduling_paused, accepting_allocations]
          properties:
            node_id: {type: string}
            scheduling_paused: {type: boolean}
            accepting_allocations: {type: boolean}
    EnvironmentView:
      type: object
      required: [instanceID, tenant_id, node_id, generation, revision, status, resources_held, invalidated, restart_pending, resume_pending, recovery_pending]
      properties:
        instanceID: {type: string}
        tenant_id: {type: string}
        node_id: {type: string}
        generation: {type: integer, minimum: 1}
        revision: {type: integer, minimum: 0}
        status: {type: string, enum: [pending, starting, running, pausing, paused, resuming, deleting, deleted, failed]}
        resources_held: {type: boolean, description: Includes reservations for pending recovery.}
        invalidated: {type: boolean}
        restart_pending: {type: boolean}
        resume_pending: {type: boolean}
        recovery_pending: {type: boolean}
