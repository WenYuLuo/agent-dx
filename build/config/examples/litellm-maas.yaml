# LiteLLM upstreams for Huawei Cloud MaaS, CN Southwest (Guiyang-1).
# MAAS_KEY is injected into the LiteLLM process environment; never put it here.
# Quota accounting: one point per million input + output tokens, including cache.
# These rates are quota units, not upstream USD prices. Pair with a 5-point, 1d key budget.
model_list:
  - model_name: deepseek-v4-flash
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: https://api.modelarts-maas.com/openai/v1
      api_key: os.environ/MAAS_KEY
    model_info:
      mode: chat
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000001
      cache_read_input_token_cost: 0.000001
      cache_creation_input_token_cost: 0.000001

  - model_name: openpangu-2.0-pro
    litellm_params:
      model: openai/openpangu-2.0-pro
      api_base: https://api.modelarts-maas.com/openai/v1
      api_key: os.environ/MAAS_KEY
    model_info:
      mode: chat
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000001
      cache_read_input_token_cost: 0.000001
      cache_creation_input_token_cost: 0.000001

  - model_name: openpangu-2.0-flash
    litellm_params:
      model: openai/openpangu-2.0-flash
      api_base: https://api.modelarts-maas.com/openai/v1
      api_key: os.environ/MAAS_KEY
    model_info:
      mode: chat
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000001
      cache_read_input_token_cost: 0.000001
      cache_creation_input_token_cost: 0.000001

  - model_name: glm-5.3
    litellm_params:
      model: openai/glm-5.3
      api_base: https://api.modelarts-maas.com/openai/v1
      api_key: os.environ/MAAS_KEY
    model_info:
      mode: chat
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000001
      cache_read_input_token_cost: 0.000001
      cache_creation_input_token_cost: 0.000001

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false

litellm_settings:
  timezone: UTC
  budget_reset_time: "00:00"
  request_timeout: 120
  num_retries: 1
  set_verbose: false
  turn_off_message_logging: true
